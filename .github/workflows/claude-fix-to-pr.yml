name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-fix-to-pr:
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude-fix-to-pr')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-fix-to-pr'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: 🚀 Acknowledge Trigger
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
          -f "content=rocket" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚚 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.28.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: 🛠️ Install dependencies
        run: pnpm install

      - name: 🤖 Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          base_branch: dev
          branch_prefix: "claude-"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 20
            --dangerously-skip-permissions
            --allowed-tools "Read,Edit,LS,Bash(git:*),Bash(gh:*)"
          prompt: |
            If any tool/command is denied, DO NOT retry. Use other allowed tools or report the blocker and STOP.
            After implementing the fix, create a PR automatically using gh pr create.
            - PR title and body format: follow CLAUDE.md
            - Do not pass --base (already configured)
            - Reference the issue number in the PR body
          show_full_output: true

        env:
          GH_TOKEN: ${{ github.token }}
