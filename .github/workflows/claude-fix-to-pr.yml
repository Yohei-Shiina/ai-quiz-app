name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit --skipLibCheck

  claude-fix-to-pr:
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude-fix-to-pr')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-fix-to-pr'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - uses: anthropics/claude-code-action@v1
        with:
          base_branch: dev
          branch_prefix: "claude-"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 20
            --dangerously-skip-permissions
            --allowed-tools "Read,Edit,LS,Bash(git:*),Bash(gh:*)"
            --disallowed-tools "Find,Glob,Grep"
          prompt: |
            Grep, Glob, and Find tools are unavailable. Use Bash(grep) and Bash(find) ONLY for searching.
            After implementing the fix, create a PR automatically using gh pr create.
            - PR title and body format: follow CLAUDE.md
            - Do not pass --base (already configured)
            - Reference the issue number in the PR body
          show_full_output: true

        env:
          GH_TOKEN: ${{ github.token }}
