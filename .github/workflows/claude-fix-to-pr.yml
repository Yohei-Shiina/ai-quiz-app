name: Claude

run-name: "Claude fix for Issue #${{ github.event.issue.number }} by @${{ github.actor }}"

on:
  issue_comment:
    types: [created]

jobs:
  claude-fix-to-pr:
    if: |
      github.event.sender.type != 'Bot' &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.comment.body, '@claude-fix-issue')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: 🚀 Acknowledge Trigger
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
          -f "content=rocket" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚚 Checkout
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.28.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: 🛠️ Install dependencies
        run: pnpm install

      - name: 🤖 Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          base_branch: dev
          branch_prefix: "claude-"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Edit,Glob,Bash(gh:*),Bash(git:*),Bash(cat:*),Bash(find:*)"
          prompt: |
            If any tool/command is denied, DO NOT retry. Use other allowed tools or report the blocker and STOP.
            Always create a new branch from dev with the name starting with "claude-".
            You are working on issue #${{ github.event.issue.number }}. Read it with gh issue view ${{ github.event.issue.number }}, implement the fix, then create a PR using gh pr create --base dev
            - Reference the issue number in the PR body

        env:
          GH_TOKEN: ${{ github.token }}
