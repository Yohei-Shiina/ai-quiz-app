name: Claude Create Issue

run-name: "Claude create issue by @${{ github.actor }}"

on:
  issue_comment:
    types: [created]

jobs:
  create-issue:
    if: |
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '@claude-create-issue')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 👀 Acknowledge
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f "content=eyes" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🤖 Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 5
            --allowedTools "Bash(gh issue create:*)"
          prompt: |
            Create a GitHub Issue based on the user's request.
            Extract the description from the text after "@claude-create-issue" and create a new issue with an appropriate title and body:
            gh issue create --title "..." --body "..."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
