name: Claude Chat

run-name: "Claude chat by @${{ github.actor }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  chat:
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude-chat')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🤖 Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-chat"
          claude_args: >-
            --max-turns 5
            --allowed-tools "Read,Glob,Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
