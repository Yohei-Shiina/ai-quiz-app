name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            You are performing a pull request review for ${{ github.repository }} #${{ github.event.pull_request.number || github.event.issue.number }}.

            Tech stack:
            - Next.js 15 App Router (TypeScript), React Server / Client Components
            - Auth.js v5 (Google OAuth, JWT sessions)
            - Prisma ORM + Supabase PostgreSQL
            - shadcn/ui + Tailwind CSS
            - OpenAI GPT-4o mini for quiz generation

            Review ONLY the changed lines in the PR diff.
            Do NOT read files beyond what is shown in the diff.

            Evaluate from three perspectives and label each finding clearly:

            ---

            ## [Code Quality] — Google Senior Engineer lens
            Naming, readability, single responsibility, TypeScript correctness,
            React/Next.js patterns (Server/Client boundary, Server Actions vs Route Handlers),
            dead code, unnecessary complexity.

            ## [Security] — OWASP lens
            Authentication/authorization gaps, injection risks (raw SQL, dangerouslySetInnerHTML),
            sensitive data exposure (API keys, env vars leaking to client),
            input validation at system boundaries.

            ## [Architecture] — Staff Engineer lens
            Server/Client boundary correctness, dependency direction (UI importing DB logic, etc.),
            coupling that will hurt as the codebase grows, premature or missing abstraction.

            ---

            Severity labels: **MUST** / **SHOULD** / **NICE-TO-HAVE** (quality/arch) and **CRITICAL** / **HIGH** / **MEDIUM** / **LOW** (security).

            Post inline comments on specific lines where applicable.
            End with a top-level summary comment grouped by perspective.
            If a perspective has no issues, state "No issues found" for that section.
