name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  interactive:
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 10
            --dangerously-skip-permissions-code-review
            --permission-mode dontAsk
            --allowed-tools Read,Edit,LS,Find,Bash(git:*),Bash(gh:*)
            --message 1. Use ONLY tools in '--allowed-tools'. In 'Bash', ONLY 'git' and 'gh' are allowed.
              2. If any tool/command is denied, DO NOT retry. Use other allowed tools or report the blocker and STOP.
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
